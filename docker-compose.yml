services:
  farmer-advisor:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:?Set OPENAI_MODEL in .env}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      - vector_store:/app/knowledge/vector_store
    restart: unless-stopped

volumes:
  vector_store:services:
  farmer-advisor:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:?Set OPENAI_MODEL in .env}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      - vector_store:/app/knowledge/vector_store
    restart: unless-stopped

volumes:
  vector_store: